<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000D4B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#flowBg)" rx="16" stroke="#DDE3EA" stroke-width="1.5"/>

  <!-- Top Bar PRF -->
  <rect x="0" y="0" width="880" height="54" fill="#000D4B" rx="16 16 0 0"/>
  <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">
    ARQUITETURA MEDALHÃO &amp; PIPELINE DE DADOS (PREFECT 3 + DOCKER)
  </text>
  <rect x="740" y="14" width="115" height="26" rx="6" fill="#FFC900"/>
  <text x="797" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#000D4B" text-anchor="middle">PUC MINAS MLOPS</text>

  <!-- Columns (Layers) -->

  <!-- 1. FONTES -->
  <g transform="translate(30, 80)">
    <rect width="170" height="420" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="4 4"/>
    <text x="85" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">FONTES DE DADOS</text>

    <!-- Box 1 -->
    <g transform="translate(15, 60)" filter="url(#boxShadow)">
      <rect width="140" height="110" rx="10" fill="#FFFFFF" stroke="#000D4B" stroke-width="2"/>
      <rect x="0" y="0" width="140" height="26" rx="8 8 0 0" fill="#000D4B"/>
      <text x="70" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#FFC900" text-anchor="middle">DADOS DA PRF</text>
      <text x="70" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Ocorrências BR-381</text>
      <text x="70" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">CSV histórico oficial</text>
      <text x="70" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Causa, tipo e KM</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(15, 210)" filter="url(#boxShadow)">
      <rect width="140" height="110" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
      <rect x="0" y="0" width="140" height="26" rx="8 8 0 0" fill="#0284C7"/>
      <text x="70" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">OPEN-METEO API</text>
      <text x="70" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Clima em Tempo Real</text>
      <text x="70" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Precipitação e vento</text>
      <text x="70" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Visibilidade e neblina</text>
    </g>
  </g>

  <!-- Connectors Fontes -> Bronze -->
  <line x1="185" y1="195" x2="245" y2="195" stroke="#000D4B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="185" y1="345" x2="245" y2="285" stroke="#000D4B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. MEDALLION ARCHITECTURE (BRONZE -> SILVER -> GOLD) -->
  <g transform="translate(250, 80)">
    <rect width="360" height="420" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="180" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#000D4B" text-anchor="middle">LAKEHOUSE POSTGRESQL (MEDALLION)</text>

    <!-- BRONZE -->
    <g transform="translate(20, 50)" filter="url(#boxShadow)">
      <rect width="320" height="70" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#B45309">🥉 CAMADA BRONZE (RAW)</text>
      <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">Ingestão idempotente dos dados brutos com schema raw_accidents.</text>
      <text x="16" y="62" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">Prefect Flow: ingest_prf_raw_flow()</text>
    </g>

    <line x1="180" y1="125" x2="180" y2="155" stroke="#000D4B" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- SILVER -->
    <g transform="translate(20, 160)" filter="url(#boxShadow)">
      <rect width="320" height="85" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.2"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#0284C7">🥈 CAMADA SILVER (ENRICHED &amp; CLEAN)</text>
      <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">Normalização de tipos, enriquecimento climático por coordenada KM</text>
      <text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">e cálculo de índices de severidade com deduplicação.</text>
      <text x="16" y="78" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">Prefect Flow: clean_and_enrich_silver()</text>
    </g>

    <line x1="180" y1="250" x2="180" y2="280" stroke="#000D4B" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- GOLD -->
    <g transform="translate(20, 285)" filter="url(#boxShadow)">
      <rect width="320" height="85" rx="8" fill="#FFFFFF" stroke="#000D4B" stroke-width="1.5"/>
      <rect x="0" y="0" width="320" height="26" rx="8 8 0 0" fill="#000D4B"/>
      <text x="16" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#FFC900">🥇 CAMADA GOLD (FEATURE STORE &amp; IA)</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">Matriz de features para Machine Learning, hotspots agregados</text>
      <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">e tabela de risco em tempo real para inferência contínua.</text>
      <text x="16" y="79" font-family="ui-monospace, monospace" font-size="10" fill="#000D4B" font-weight="600">Prefect Flow: build_gold_features_flow()</text>
    </g>
  </g>

  <!-- Connectors Gold -> MLOps -->
  <line x1="595" y1="365" x2="655" y2="365" stroke="#000D4B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. MLOPS & SERVING -->
  <g transform="translate(660, 80)">
    <rect width="190" height="420" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="4 4"/>
    <text x="95" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#000D4B" text-anchor="middle">MLOPS &amp; ALERTAS</text>

    <!-- ML Inference -->
    <g transform="translate(15, 60)" filter="url(#boxShadow)">
      <rect width="160" height="110" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
      <rect x="0" y="0" width="160" height="26" rx="8 8 0 0" fill="#059669"/>
      <text x="80" y="17" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">RANDOM FOREST</text>
      <text x="80" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Scikit-Learn Joblib</text>
      <text x="80" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Classificação binária</text>
      <text x="80" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Recall: 81.4%</text>
    </g>

    <line x1="95" y1="175" x2="95" y2="205" stroke="#000D4B" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Telegram Alerting -->
    <g transform="translate(15, 210)" filter="url(#boxShadow)">
      <rect width="160" height="110" rx="10" fill="#FFFFFF" stroke="#000D4B" stroke-width="2"/>
      <rect x="0" y="0" width="160" height="26" rx="8 8 0 0" fill="#000D4B"/>
      <text x="80" y="17" font-family="ui-monospace, monospace" font-size="10" font-weight="800" fill="#FFC900" text-anchor="middle">TELEGRAM BOT</text>
      <text x="80" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Alertas Operacionais</text>
      <text x="80" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Threshold > 50%</text>
      <text x="80" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Notificação c/ Cooldown</text>
    </g>
  </g>
</svg>
